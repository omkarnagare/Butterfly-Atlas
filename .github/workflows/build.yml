name: Build

# Runs on a pull request to master once it is marked Ready for review (drafts run nothing), and again on each push while
# it is ready; the build tests the pull request merged with master. It is a required check on master, so nothing is
# merged unless it passes on all three systems. It can also be started by hand (Actions tab -> Build -> Run workflow, or
# `gh workflow run build.yml --ref <branch>`). Every change is still verified locally with `./mvnw -B -ntp clean verify`
# before it is pushed.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

# A newer push to the same pull request stops the older run.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache downloaded Node
        uses: actions/cache@v4
        with:
          path: ui/target/node
          key: node-${{ runner.os }}-${{ hashFiles('pom.xml') }}

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Build and test
        shell: bash
        run: ./mvnw -B -ntp verify
